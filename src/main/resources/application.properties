spring.profiles.active=local
# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=hnw-demo

# ── Virtual threads (Java 21 / Spring Boot 3.3+) ─────────────────────────────
spring.threads.virtual.enabled=true

# ── PostgreSQL (portfolio data) ───────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxdemo}
spring.datasource.username=${POSTGRES_USER:taxdemo}
spring.datasource.password=${POSTGRES_PASSWORD:taxdemo_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Databricks (financial alerts) ────────────────────────────────────────────
databricks.host=${DATABRICKS_HOST}
databricks.http-path=${DATABRICKS_HTTP_PATH:/sql/1.0/warehouses/48bcee842d12db01/}
databricks.client-id=${DATABRICKS_CLIENT_ID}
databricks.client-secret=${DATABRICKS_CLIENT_SECRET}
databricks.catalog=${DATABRICKS_CATALOG:workspace}
databricks.schema=${DATABRICKS_SCHEMA:default}
databricks.poll-interval-seconds=${DATABRICKS_POLL_INTERVAL:10}

# ── Anthropic Claude API ──────────────────────────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.edwardjones.demo=DEBUG
logging.level.com.edwardjones.demo.alert=INFO
